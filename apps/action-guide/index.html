<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30天行动指南</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563eb;--primary-light:#dbeafe;--success:#16a34a;--success-light:#dcfce7;--warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;--bg:#f8fafc;--card:#fff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);padding:20px 0;overflow-y:auto;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.sidebar-header{padding:0 20px 20px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:18px;color:var(--primary)}
.sidebar-header .progress-bar{margin-top:12px;background:var(--border);border-radius:10px;height:8px;overflow:hidden}
.sidebar-header .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--success));border-radius:10px;transition:width .5s}
.sidebar-header .progress-text{font-size:12px;color:var(--text-secondary);margin-top:4px}
.nav-group{padding:12px 0}
.nav-group-title{padding:4px 20px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 20px;cursor:pointer;transition:background .2s;font-size:14px;border:none;background:none;width:100%;text-align:left;color:var(--text)}
.nav-item:hover{background:var(--primary-light)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-item .day-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--border);color:var(--text-secondary);flex-shrink:0}
.nav-item.active .day-num{background:var(--primary);color:#fff}
.nav-item.completed .day-num{background:var(--success);color:#fff}
.nav-item .day-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .check-icon{color:var(--success);font-size:16px}
.main{flex:1;margin-left:280px;padding:24px;max-width:800px}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;z-index:90;align-items:center;gap:12px}
.hamburger{background:none;border:none;font-size:24px;cursor:pointer;padding:4px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px}
.card h2{font-size:20px;margin-bottom:16px;color:var(--text)}
.card h3{font-size:16px;margin:16px 0 8px;color:var(--text)}
.card p,.card li{font-size:14px;color:var(--text-secondary);margin-bottom:8px}
.card ul,.card ol{padding-left:20px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;transition:all .2s}
.task-item:hover{border-color:var(--primary)}
.task-item.checked{background:var(--success-light);border-color:var(--success)}
.task-item input[type="checkbox"]{width:20px;height:20px;margin-top:2px;cursor:pointer;accent-color:var(--success);flex-shrink:0}
.task-item label{cursor:pointer;flex:1;font-size:14px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text)}
.input-group textarea,.input-group input[type="text"],.input-group input[type="number"]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:border-color .2s;background:var(--bg)}
.input-group textarea:focus,.input-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.input-group textarea{min-height:60px;resize:vertical}
.radio-group{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.radio-option{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:14px}
.radio-option:hover{border-color:var(--primary)}
.radio-option.selected{background:var(--primary-light);border-color:var(--primary)}
.radio-option input[type="radio"]{accent-color:var(--primary);width:16px;height:16px}
.result-box{padding:16px;border-radius:8px;margin:16px 0;font-size:14px}
.result-box.safe{background:var(--success-light);border-left:4px solid var(--success)}
.result-box.warning{background:var(--warning-light);border-left:4px solid var(--warning)}
.result-box.danger{background:var(--danger-light);border-left:4px solid var(--danger)}
.result-box.info{background:var(--primary-light);border-left:4px solid var(--primary)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}
.badge.safe{background:var(--success-light);color:var(--success)}
.badge.warning{background:var(--warning-light);color:var(--warning)}
.badge.danger{background:var(--danger-light);color:var(--danger)}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
th,td{padding:8px 12px;border:1px solid var(--border);text-align:left}
th{background:var(--bg);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#15803d}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.day-nav{display:flex;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.section-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.highlight{background:linear-gradient(120deg,var(--warning-light) 0%,var(--warning-light) 100%);padding:2px 4px;border-radius:4px}
.emoji-indicator{font-size:16px}
.week-header{text-align:center;padding:20px;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;border-radius:var(--radius);margin-bottom:20px}
.week-header h1{font-size:24px;margin-bottom:4px}
.week-header p{opacity:.85;font-size:14px}
.template-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin:12px 0;font-size:13px;white-space:pre-wrap;font-family:inherit;position:relative}
.template-box .copy-btn{position:absolute;top:8px;right:8px;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.summary-card{padding:16px;border-radius:8px;border:1px solid var(--border)}
.summary-card h4{font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.summary-card .value{font-size:24px;font-weight:700}
.final-message{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border-radius:var(--radius);margin:20px 0}
.final-message h2{color:var(--primary);margin-bottom:16px}
.final-message p{color:var(--text-secondary);max-width:500px;margin:8px auto}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0;padding:16px;padding-top:60px}
.mobile-header{display:flex}
.overlay.show{display:block}
.summary-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="mobile-header" id="mobileHeader">
<button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
<span style="font-weight:600">30天行动指南</span>
</div>
<nav class="sidebar" id="sidebar"></nav>
<main class="main" id="content"></main>
</div>
<script>
// ========== DATA STORE ==========
const STORAGE_KEY = 'action_guide_30days';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getData(key, fallback) { const d = loadData(); return d[key] !== undefined ? d[key] : fallback; }
function setData(key, value) { const d = loadData(); d[key] = value; saveData(d); }

let currentDay = getData('currentDay', 1);

// ========== DAY DEFINITIONS ==========
const days = [
  {day:1, title:'热爱测试 + 倦怠检测 + 文化匹配', week:'第1天', tasks:3, time:'30分钟'},
  {day:2, title:'建立工作时长追踪', week:'第2-7天', tasks:1, time:'5分钟'},
  {day:3, title:'设定"够了"阈值', week:'第2-7天', tasks:1, time:'10分钟'},
  {day:4, title:'找到你的"热爱信号"', week:'第2-7天', tasks:1, time:'15分钟'},
  {day:5, title:'创建"独特价值"清单', week:'第2-7天', tasks:1, time:'10分钟'},
  {day:6, title:'周末强制休息测试', week:'第2-7天', tasks:1, time:'全天'},
  {day:7, title:'第一周总结', week:'第2-7天', tasks:1, time:'15分钟'},
  {day:8, title:'竞争维度转换', week:'第8-14天', tasks:1, time:'10分钟'},
  {day:9, title:'时间审计', week:'第8-14天', tasks:1, time:'20分钟'},
  {day:10, title:'建立"拒绝"话术', week:'第8-14天', tasks:1, time:'10分钟'},
  {day:11, title:'设定"完美主义熔断器"', week:'第8-14天', tasks:1, time:'15分钟'},
  {day:12, title:'找到你的"能量源"', week:'第8-14天', tasks:1, time:'10分钟'},
  {day:13, title:'建立"每日收盘"仪式', week:'第8-14天', tasks:1, time:'5分钟/天'},
  {day:14, title:'第二周总结+调整', week:'第8-14天', tasks:1, time:'20分钟'},
  {day:15, title:'文化匹配深度测试', week:'第15-21天', tasks:1, time:'30分钟'},
  {day:16, title:'准备面试问题', week:'第15-21天', tasks:1, time:'15分钟'},
  {day:17, title:'投递简历（外企1）', week:'第15-21天', tasks:1, time:'30分钟'},
  {day:18, title:'投递简历（外企2）', week:'第15-21天', tasks:1, time:'30分钟'},
  {day:19, title:'投递简历（大厂1）', week:'第15-21天', tasks:1, time:'30分钟'},
  {day:20, title:'投递简历（大厂2）', week:'第15-21天', tasks:1, time:'30分钟'},
  {day:21, title:'第三周总结', week:'第15-21天', tasks:1, time:'15分钟'},
  {day:22, title:'3年后的你', week:'第22-28天', tasks:1, time:'15分钟'},
  {day:23, title:'找到你的"导师"', week:'第22-28天', tasks:1, time:'20分钟'},
  {day:24, title:'建立"学习地图"', week:'第22-28天', tasks:1, time:'20分钟'},
  {day:25, title:'删除"假学习"', week:'第22-28天', tasks:1, time:'10分钟'},
  {day:26, title:'建立"输出倒逼输入"', week:'第22-28天', tasks:1, time:'15分钟'},
  {day:27, title:'建立"能量账户"', week:'第22-28天', tasks:1, time:'10分钟'},
  {day:28, title:'第四周总结', week:'第22-28天', tasks:1, time:'30分钟'},
  {day:29, title:'最后准备 - 数据汇总', week:'第29-30天', tasks:1, time:'60分钟'},
  {day:30, title:'最终决策日', week:'第29-30天', tasks:1, time:'90分钟'},
];

const weekGroups = [
  {label:'启动日', range:[1,1]},
  {label:'第一周 · 诊断', range:[2,7]},
  {label:'第二周 · 优化', range:[8,14]},
  {label:'第三周 · 验证', range:[15,21]},
  {label:'第四周 · 方向', range:[22,28]},
  {label:'最终决策', range:[29,30]},
];

// ========== SIDEBAR ==========
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  const completedDays = days.filter(d => getData('day_'+d.day+'_completed', false)).length;
  const pct = Math.round(completedDays / 30 * 100);
  let html = `<div class="sidebar-header">
    <h2>30天行动指南</h2>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-text">已完成 ${completedDays}/30 天 (${pct}%)</div>
  </div>`;
  weekGroups.forEach(g => {
    html += `<div class="nav-group"><div class="nav-group-title">${g.label}</div>`;
    for (let i = g.range[0]; i <= g.range[1]; i++) {
      const d = days[i-1];
      const completed = getData('day_'+d.day+'_completed', false);
      const cls = (d.day === currentDay ? ' active' : '') + (completed ? ' completed' : '');
      html += `<button class="nav-item${cls}" onclick="goToDay(${d.day})">
        <span class="day-num">${d.day}</span>
        <span class="day-label">${d.title}</span>
        ${completed ? '<span class="check-icon">&#10003;</span>' : ''}
      </button>`;
    }
    html += '</div>';
  });
  sb.innerHTML = html;
}

function goToDay(day) {
  currentDay = day;
  setData('currentDay', day);
  renderSidebar();
  renderContent();
  toggleSidebar(false);
  window.scrollTo(0, 0);
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

// ========== HELPER RENDERERS ==========
function checkbox(id, label) {
  const checked = getData(id, false);
  return `<div class="task-item${checked?' checked':''}" onclick="toggleCheck('${id}',this)">
    <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleCheck('${id}',this.parentNode)">
    <label>${label}</label></div>`;
}

function toggleCheck(id, el) {
  const val = !getData(id, false);
  setData(id, val);
  const cb = el.querySelector('input[type=checkbox]');
  cb.checked = val;
  el.classList.toggle('checked', val);
  updateDayCompletion();
  renderSidebar();
}

function textInput(id, label, placeholder, multiline) {
  const val = getData(id, '');
  if (multiline) {
    return `<div class="input-group"><label>${label}</label>
      <textarea placeholder="${placeholder||''}" oninput="setData('${id}',this.value)">${val}</textarea></div>`;
  }
  return `<div class="input-group"><label>${label}</label>
    <input type="text" value="${val.replace(/"/g,'&quot;')}" placeholder="${placeholder||''}" oninput="setData('${id}',this.value)"></div>`;
}

function numInput(id, label, placeholder) {
  const val = getData(id, '');
  return `<div class="input-group"><label>${label}</label>
    <input type="number" value="${val}" placeholder="${placeholder||''}" oninput="setData('${id}',this.value)"></div>`;
}

function radioGroup(id, label, options) {
  const val = getData(id, '');
  let html = `<div class="input-group"><label style="font-weight:600;margin-bottom:8px">${label}</label><div class="radio-group">`;
  options.forEach((opt, i) => {
    const selected = val === opt.value;
    html += `<label class="radio-option${selected?' selected':''}" onclick="selectRadio('${id}','${opt.value}',this)">
      <input type="radio" name="${id}" value="${opt.value}" ${selected?'checked':''}>
      <span>${opt.label}</span></label>`;
  });
  html += '</div></div>';
  return html;
}

function selectRadio(id, value, el) {
  setData(id, value);
  const parent = el.parentNode;
  parent.querySelectorAll('.radio-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  el.querySelector('input').checked = true;
  // Re-render to update dynamic results
  renderContent();
}

function resultBox(type, content) {
  return `<div class="result-box ${type}">${content}</div>`;
}

function templateBox(text) {
  return `<div class="template-box"><button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentNode.textContent.replace('复制','').trim())">复制</button>${text}</div>`;
}

function markDayComplete(day) {
  setData('day_'+day+'_completed', true);
  renderSidebar();
  renderContent();
}

function updateDayCompletion() {
  // Auto-completion logic can be added per day
}

function dayNav() {
  let html = '<div class="day-nav">';
  if (currentDay > 1) html += `<button class="btn btn-outline" onclick="goToDay(${currentDay-1})">&larr; 第${currentDay-1}天</button>`;
  else html += '<span></span>';
  html += `<button class="btn btn-success" onclick="markDayComplete(${currentDay})">&#10003; 标记完成</button>`;
  if (currentDay < 30) html += `<button class="btn btn-primary" onclick="goToDay(${currentDay+1})">第${currentDay+1}天 &rarr;</button>`;
  else html += '<span></span>';
  html += '</div>';
  return html;
}
// ========== DAY CONTENT RENDERERS ==========
function renderDay1() {
  let html = `<div class="week-header"><h1>第1天</h1><p>3个任务，共30分钟 · 今天就开始，不要等</p></div>`;

  // Task 1: 热爱测试
  html += `<div class="card"><h2>任务1：热爱测试（10分钟）</h2>
    <p style="color:var(--primary);font-weight:600;margin-bottom:16px">现在就做，不要等。回答这5个问题：</p>
    ${textInput('d1_q1','1. 过去1年，我在周末会主动想哪些工作内容？','写下你的答案...',true)}
    ${textInput('d1_q2','2. 过去1年，哪个项目我做到凌晨还不觉得累？','写下你的答案...',true)}
    ${textInput('d1_q3','3. 过去1年，哪个话题我可以跟人聊1小时不无聊？','写下你的答案...',true)}
    ${textInput('d1_q4','4. 如果明天开始没有工资，我还会继续做什么？','写下你的答案...',true)}
    ${textInput('d1_q5','5. 我现在正在做的工作是：','写下你的答案...',true)}
    <h3>立即判断：</h3>
    ${radioGroup('d1_direction','问题1-4的答案，跟问题5的关系：',[
      {value:'match',label:'✅ 相关 → 继续当前方向'},
      {value:'mismatch',label:'🛑 完全无关 → 方向错了，需要调整'}
    ])}`;
  if (getData('d1_direction','') === 'mismatch') {
    html += resultBox('danger','<strong>方向需要调整！</strong>请设定调整期限：') +
      textInput('d1_deadline','调整期限（年-月-日）','例如：2026-06-01') +
      checkbox('d1_calendar','已把调整日期写在手机日历里，设置了提醒');
  }
  html += '</div>';

  // Task 2: 倦怠检测
  html += `<div class="card"><h2>任务2：倦怠风险检测（10分钟）</h2>
    ${numInput('d1_hours','1. 过去1个月，我平均每周工作多少小时？','例如：55')}
    ${numInput('d1_anxiety','2. 过去1个月，因为"没赢过别人"而焦虑的次数？','例如：8')}
    ${numInput('d1_compare','3. 过去1个月，想"今年要超过去年"的次数？','例如：5')}
    ${numInput('d1_sustain','4. 当前工作节奏能持续多少年？（诚实回答）','例如：2')}`;

  const hours = parseInt(getData('d1_hours','')) || 0;
  const anxiety = parseInt(getData('d1_anxiety','')) || 0;
  const sustain = parseInt(getData('d1_sustain','')) || 0;

  if (hours || anxiety || sustain) {
    html += '<h3>诊断结果：</h3><table><tr><th>指标</th><th>你的数值</th><th>风险等级</th><th>建议</th></tr>';
    if (hours) {
      const hRisk = hours < 60 ? 'safe' : hours <= 70 ? 'warning' : 'danger';
      const hAdvice = hours < 60 ? '保持' : hours <= 70 ? '下周减少到60h' : '明天开始拒绝新任务';
      html += `<tr><td>工作时长</td><td>${hours}h/周</td><td><span class="badge ${hRisk}">${hRisk==='safe'?'✅安全':hRisk==='warning'?'⚠️警告':'🛑危险'}</span></td><td>${hAdvice}</td></tr>`;
    }
    if (anxiety) {
      const aRisk = anxiety < 5 ? 'safe' : anxiety <= 15 ? 'warning' : 'danger';
      const aAdvice = anxiety < 5 ? '保持' : anxiety <= 15 ? '继续监测' : '本周预约心理咨询';
      html += `<tr><td>焦虑频率</td><td>${anxiety}次/月</td><td><span class="badge ${aRisk}">${aRisk==='safe'?'✅安全':aRisk==='warning'?'⚠️警告':'🛑危险'}</span></td><td>${aAdvice}</td></tr>`;
    }
    if (sustain) {
      const sRisk = sustain > 3 ? 'safe' : sustain >= 1 ? 'warning' : 'danger';
      const sAdvice = sustain > 3 ? '保持' : sustain >= 1 ? '需要优化节奏' : '立即降低强度';
      html += `<tr><td>可持续性</td><td>${sustain}年</td><td><span class="badge ${sRisk}">${sRisk==='safe'?'✅安全':sRisk==='warning'?'⚠️警告':'🛑危险'}</span></td><td>${sAdvice}</td></tr>`;
    }
    html += '</table>';
